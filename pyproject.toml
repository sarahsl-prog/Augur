[project]
name = "augur"
version = "0.1.0"
description = "Self-improving security alert triage agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=0.4.0",
    "google-cloud-aiplatform>=1.71.0",
    "openinference-instrumentation-google-adk>=0.1.0",
    "arize-phoenix-otel>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
